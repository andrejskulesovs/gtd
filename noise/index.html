<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-gradient"></div>
    <div class="noise-overlay"></div>
    <div class="timer-popup hidden" id="timer-popup" role="alertdialog" aria-live="assertive" aria-labelledby="timer-popup-title">
        <div class="timer-popup__panel">
            <p class="timer-popup__eyebrow">Timer ended</p>
            <h3 id="timer-popup-title">Focus session complete</h3>
            <p class="timer-popup__message" id="timer-popup-message">Take a short break before starting the next session.</p>
            <div class="timer-popup__actions">
                <button id="popup-short" class="next-btn next-btn--focus">Start Break</button>
                <button id="popup-focus" class="next-btn">New Focus</button>
                <button id="popup-close" class="next-btn">Close</button>
            </div>
        </div>
    </div>

    <main class="app-container">
        <section class="timer-wrapper glass-panel">
            <h2>Pomodoro Timer</h2>
            <div class="timer-modes">
                <button class="mode-btn selected" data-mode="focus">Focus</button>
                <button class="mode-btn" data-mode="short">Short Break</button>
                <button class="mode-btn" data-mode="long">Long Break</button>
            </div>
            <div class="timer-display" id="timer-display">25:00</div>
            <div class="timer-control">
                <button id="timer-toggle" class="primary-btn">Start</button>
            </div>
            <div class="timer-next-actions hidden" id="timer-next-actions">
                <p class="next-label">Session done! What's next?</p>
                <div class="next-btns">
                    <button id="action-short" class="next-btn">5 min Break</button>
                    <button id="action-long" class="next-btn">15 min Break</button>
                    <button id="action-focus" class="next-btn next-btn--focus">Next Focus</button>
                </div>
            </div>
        </section>

        <section class="controls-wrapper glass-panel">
            <h2>Sonic Sanctuary</h2>
            <div class="presets">
                <div class="preset-grid">
                    <button class="preset-btn" data-type="white">
                        <span class="icon">⚪</span>
                        <span class="label">White</span>
                    </button>
                    <button class="preset-btn" data-type="pink">
                        <span class="icon">🌸</span>
                        <span class="label">Pink</span>
                    </button>
                    <button class="preset-btn" data-type="brown">
                        <span class="icon">☕</span>
                        <span class="label">Brown</span>
                    </button>
                    <button class="preset-btn" data-type="speech_blocker">
                        <span class="icon">🛡️</span>
                        <span class="label">Speech Blocker</span>
                    </button>
                </div>
            </div>

            <div class="sliders">
                <div class="slider-group">
                    <label for="volume">Master Volume</label>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
                </div>

                <div class="customizer hidden" id="customizer-panel">
                    <h3>Fine Tune</h3>
                    <div class="slider-group">
                        <label for="low-pass">Muffle (Low Pass)</label>
                        <input type="range" id="low-pass" min="200" max="20000" step="100" value="20000">
                    </div>
                </div>
            </div>

            <div class="play-control">
                <div class="visualizer-container">
                    <canvas id="visualizer"></canvas>
                    <div class="status-indicator" id="status-indicator">OFF</div>
                </div>
                <button id="play-pause" class="primary-btn">
                    <span class="play-icon">▶</span>
                    Play
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
